<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>iPhone 15</title>
<style>
  /* Moldura de iPhone 15 (393 × 852 pt) com barra de status e Safari do iOS 26.
     O site roda dentro do <iframe>; o abrir-iphone.mjs controla voltar/recarregar. */
  :root { --tela-l: 393px; --tela-a: 852px; --borda: 13px; --raio: 58px; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: radial-gradient(circle at 50% 30%, #2a2c31, #141518); overflow: hidden;
    font-family: -apple-system, "SF Pro Text", "Segoe UI", system-ui, sans-serif; }
  .palco { position: absolute; left: 50%; top: 50%; transform-origin: center; }
  .aparelho {
    position: relative; width: calc(var(--tela-l) + 2 * var(--borda)); height: calc(var(--tela-a) + 2 * var(--borda));
    border-radius: calc(var(--raio) + var(--borda)); background: #0b0b0c; padding: var(--borda);
    /* aro de titânio */
    box-shadow: 0 0 0 2px #5b5d63, 0 0 0 3.5px #2b2c30, 0 0 0 5px #8e9097;
    cursor: grab; /* arrasta a janela pela borda do aparelho */
  }
  .tela { cursor: auto; }
  .status, .ilha { cursor: grab; }
  .botao.liga { cursor: pointer; }
  .botao { position: absolute; width: 4px; border-radius: 2px; background: linear-gradient(90deg, #6d6f75, #a4a6ad, #6d6f75); }
  .botao.acao { left: -8px; top: 150px; height: 32px; }
  .botao.vol1 { left: -8px; top: 205px; height: 60px; }
  .botao.vol2 { left: -8px; top: 278px; height: 60px; }
  .botao.liga { right: -8px; top: 240px; height: 96px; }
  .tela { position: relative; width: var(--tela-l); height: var(--tela-a); border-radius: var(--raio); overflow: hidden; background: var(--fundo, #000); }
  /* Barra de status */
  .status { position: absolute; inset: 0 0 auto 0; height: 59px; display: flex; align-items: center; justify-content: space-between;
    padding: 6px 30px 0 46px; color: var(--cor-status, #fff); font-weight: 600; font-size: 17px; letter-spacing: -.2px; z-index: 3; background: var(--fundo, #000); }
  .ilha { position: absolute; left: 50%; top: 11px; width: 125px; height: 37px; margin-left: -62.5px; background: #000; border-radius: 20px; z-index: 4; }
  .icones { display: flex; gap: 6px; align-items: center; }
  .icones svg { fill: currentColor; }
  /* Área do site: 393 × 659, igual ao Safari do iPhone 15 com as barras visíveis */
  iframe { position: absolute; left: 0; top: 59px; width: var(--tela-l); height: 659px; border: 0; background: #fff; z-index: 1; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  /* Barra do Safari embaixo: endereço + botões (voltar, avançar, compartilhar, favoritos, abas) */
  .safari { position: absolute; left: 0; right: 0; bottom: 0; height: 134px; z-index: 3; padding: 8px 12px 0;
    background: rgba(246,246,248,.96); border-top: .5px solid rgba(0,0,0,.12); color: #0a84ff; }
  .url { width: 100%; height: 46px; border-radius: 13px; display: flex; align-items: center; gap: 8px; padding: 0 14px;
    background: rgba(118,118,128,.14); color: #111; font-size: 16px; }
  .url .aa { font-weight: 600; font-size: 15px; letter-spacing: -.3px; }
  .url span#endereco { flex: 1; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: text; }
  .url input { display: none; flex: 1; min-width: 0; height: 32px; border: 0; outline: 0; background: transparent; font: inherit; color: inherit; }
  .url.editando span#endereco, .url.editando .aa { display: none; }
  .url.editando input { display: block; }
  .ferramentas { display: flex; justify-content: space-between; align-items: center; height: 46px; margin-top: 4px; padding: 0 10px; }
  .ferramentas button { width: 44px; height: 44px; display: grid; place-items: center; }
  .ferramentas button:active, #recarregar:active { opacity: .5; }
  #recarregar { display: grid; place-items: center; width: 28px; height: 28px; }
  .ferramentas svg { stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .barra-casa { position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: rgba(0,0,0,.85); z-index: 4; }
  .tema-escuro .safari { background: rgba(28,28,30,.97); border-top-color: rgba(255,255,255,.1); }
  .tema-escuro .url { background: rgba(118,118,128,.24); color: #f2f2f4; }
  .tema-escuro .barra-casa { background: rgba(255,255,255,.85); }
</style>
</head>
<body>
<div class="palco" id="palco">
  <div class="aparelho">
    <i class="botao acao"></i><i class="botao vol1"></i><i class="botao vol2"></i><i class="botao liga" title="Desligar (fechar o iPhone)"></i>
    <div class="tela" id="tela">
      <div class="status">
        <span id="hora">9:41</span>
        <span class="icones">
          <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
          <svg width="17" height="12" viewBox="0 0 17 12"><path d="M8.5 2.3c2.3 0 4.4.9 6 2.4l1.2-1.2A10.2 10.2 0 0 0 8.5.6 10.2 10.2 0 0 0 1.3 3.5l1.2 1.2a8.5 8.5 0 0 1 6-2.4Zm0 3.4c1.4 0 2.7.5 3.6 1.4l1.2-1.2a6.8 6.8 0 0 0-9.6 0L4.9 7c1-.8 2.2-1.3 3.6-1.3Zm0 3.4c.5 0 .9.2 1.3.5L8.5 11 7.2 9.6c.4-.3.8-.5 1.3-.5Z"/></svg>
          <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2Z" opacity=".5"/></svg>
        </span>
      </div>
      <div class="ilha"></div>
      <iframe id="site" title="site" allow="clipboard-write; fullscreen"></iframe>
      <div class="safari">
        <div class="url"><span class="aa">AA</span><span id="endereco" title="Clique para digitar um endereço">carregando…</span>
          <input id="digitar" type="text" placeholder="Digite o endereço do site" spellcheck="false" autocomplete="off">
          <button id="recarregar" title="Recarregar"><svg width="16" height="16" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
        <div class="ferramentas">
          <button id="voltar" title="Voltar"><svg width="14" height="22" viewBox="0 0 14 22"><path d="M11 2 2 11l9 9"/></svg></button>
          <button id="avancar" title="Avançar"><svg width="14" height="22" viewBox="0 0 14 22"><path d="m3 2 9 9-9 9"/></svg></button>
          <button id="mais" title="Compartilhar: abrir no navegador do PC"><svg width="22" height="26" viewBox="0 0 22 26"><path d="M11 16V2M6 7l5-5 5 5M7 11H4v13h14V11h-3"/></svg></button>
          <button title="Favoritos"><svg width="26" height="22" viewBox="0 0 26 22"><path d="M13 5c-2-2-5-3-11-3v17c6 0 9 1 11 3 2-2 5-3 11-3V2c-6 0-9 1-11 3Zm0 0v17"/></svg></button>
          <button title="Abas"><svg width="24" height="24" viewBox="0 0 24 24"><rect x="2" y="7" width="15" height="15" rx="3"/><path d="M7 4V3a1 1 0 0 1 1-1h13a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-1"/></svg></button>
        </div>
      </div>
      <div class="barra-casa"></div>
    </div>
  </div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById("site").src = q.get("url") || "about:blank";
  // Ajusta o tamanho do aparelho à janela
  const palco = document.getElementById("palco");
  function ajustar() {
    const s = Math.min(1, (innerHeight - 6) / 888, (innerWidth - 4) / 436);
    palco.style.transform = `translate(-50%, -50%) scale(${s})`;
  }
  addEventListener("resize", ajustar); ajustar();
  // Relógio
  const h = () => { const d = new Date(); document.getElementById("hora").textContent = d.getHours() + ":" + String(d.getMinutes()).padStart(2, "0"); };
  h(); setInterval(h, 15000);
  // Chamado pelo Node a cada navegação do site
  window.atualizarSafari = (host, fundo, escuro) => {
    document.getElementById("endereco").textContent = host;
    const tela = document.getElementById("tela");
    tela.style.setProperty("--fundo", fundo || "#000");
    tela.style.setProperty("--cor-status", escuro ? "#fff" : "#000");
    document.body.classList.toggle("tema-escuro", !!escuro);
  };
  // Contorno do aparelho (para a janela virar só o iPhone, com fundo transparente)
  window.formaDoAparelho = () => {
    const ap = document.querySelector(".aparelho").getBoundingClientRect();
    const esc = ap.width / document.querySelector(".aparelho").offsetWidth;
    const anel = 5 * esc, raio = (58 + 13) * esc + anel;
    const partes = ["forma", ap.left - anel, ap.top - anel, ap.width + 2 * anel, ap.height + 2 * anel, raio];
    document.querySelectorAll(".botao").forEach((b) => { const r = b.getBoundingClientRect(); partes.push("btn", r.left, r.top, r.width, r.height); });
    return partes.map((v) => (typeof v === "number" ? Math.round(v) : v)).join(" ");
  };
  // Arrastar pela borda do aparelho; botão lateral direito fecha
  document.querySelector(".aparelho").addEventListener("mousedown", (e) => {
    // borda do aparelho OU barra de status (hora, ilha, bateria) servem de "barra de título"
    const naBarra = e.target.closest(".status") || e.target.closest(".ilha");
    if (e.button !== 0 || e.target.closest(".liga") || (e.target.closest(".tela") && !naBarra)) return;
    e.preventDefault();
    // O ajudante segue o mouse direto pelo Windows até o botão ser solto
    window.arrastarInicio && window.arrastarInicio();
  });
  document.querySelector(".botao.liga").onclick = () => window.fecharIphone && window.fecharIphone();
  document.getElementById("voltar").onclick = () => window.safariVoltar && window.safariVoltar();
  document.getElementById("avancar").onclick = () => window.safariAvancar && window.safariAvancar();
  // Barra de endereço: clique no endereço para digitar outro site (Enter abre, Esc cancela)
  const barra = document.querySelector(".url"), campo = document.getElementById("digitar");
  document.getElementById("endereco").onclick = () => { barra.classList.add("editando"); campo.value = ""; campo.focus(); };
  campo.onblur = () => barra.classList.remove("editando");
  campo.onkeydown = (e) => {
    if (e.key === "Escape") return campo.blur();
    if (e.key !== "Enter" || !campo.value.trim()) return;
    let u = campo.value.trim();
    if (!/^https?:\/\//i.test(u)) u = (/^(localhost|127\.0\.0\.1)(:|\/|$)/.test(u) ? "http://" : "https://") + u;
    document.getElementById("site").src = u;
    document.getElementById("endereco").textContent = "carregando…";
    campo.blur();
  };
  document.getElementById("recarregar").onclick = () => window.safariRecarregar && window.safariRecarregar();
  document.getElementById("mais").onclick = () => window.safariAbrirNoPc && window.safariAbrirNoPc();
</script>
</body>
</html>
